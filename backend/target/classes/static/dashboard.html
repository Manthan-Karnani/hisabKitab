<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hisab Kitab — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">₹</div>
      <div>
        <h1>HISAB KITAB</h1>
        <small>Bahi-khata for the modern wallet — har rupaye ka hisab</small>
      </div>
    </div>
    <div class="userbox">
      <span class="pill" id="userPill">…</span>
      <button id="logoutBtn" class="ghost small" style="background:transparent;color:var(--gold-pale);border-color:var(--gold)">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="toolbar">
        <div>
          <label>Month</label>
          <input id="monthPicker" type="month" />
        </div>
        <div>
          <label>Monthly Budget (₹) — expenses get deducted from this</label>
          <div class="row">
            <input id="budgetInput" type="number" min="1" step="0.01" placeholder="e.g. 20000" style="flex:1" />
            <button id="saveBudgetBtn">Save Budget</button>
          </div>
        </div>
      </div>
      <div class="progress"><div id="budgetBar"></div></div>
      <div id="budgetMsg" style="margin-top:8px;color:var(--muted);font-size:14px"></div>
    </div>

    <div class="grid three">
      <div class="stat budget"><div class="label">Monthly Budget</div><div class="value" id="statBudget">₹0</div></div>
      <div class="stat spent"><div class="label">Total Spent</div><div class="value" id="statSpent">₹0</div></div>
      <div class="stat left"><div class="label">Remaining</div><div class="value" id="statLeft">₹0</div></div>
    </div>
    <div style="height:18px"></div>

    <div class="cash-strip"></div>

    <div class="grid two">
      <div class="card">
        <h3>New Entry — Bahi-khata</h3>
        <label>Category</label>
        <select id="expCategory"></select>
        <div class="row">
          <input id="newCat" placeholder="New category name" style="flex:1" />
          <button id="addCatBtn" class="ghost" type="button">Add</button>
        </div>
        <label>Amount (₹)</label>
        <input id="expAmount" type="number" min="0.01" step="0.01" placeholder="e.g. 350" />
        <label>Date</label>
        <input id="expDate" type="date" />
        <label>Note (optional)</label>
        <input id="expNote" placeholder="e.g. lunch with friends" />
        <div style="height:12px"></div>
        <button id="addExpBtn" style="width:100%">Add Expense</button>
      </div>

      <div class="card">
        <h3>Category-wise Summary</h3>
        <div class="chart-box"><canvas id="catChart"></canvas></div>
        <div id="catLegend" style="margin-top:10px;font-size:14px"></div>
      </div>
    </div>

    <div class="card">
      <h3>Month Ledger</h3>
      <div id="expTableWrap"><div class="empty">No expenses yet — add your first one!</div></div>
    </div>
  </div>

  <footer>
    <div>&copy; 2026 <strong>Hisab Kitab</strong> | All rights reserved</div>
    <div>Made by <strong>Manthan, Rahul and Aarush</strong></div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
